# Postgres สำหรับ local dev + test เท่านั้น (production ใช้ Postgres ของ Railway)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ai_crm
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # สร้าง ai_crm_test เพิ่มตอน init volume ครั้งแรก
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d ai_crm']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
