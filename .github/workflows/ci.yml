name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # DB ชั่วคราวใน CI เท่านั้น
          POSTGRES_DB: ai_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_crm_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_crm_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_crm_test
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # PageProps / route types ของ Next มาจากไฟล์ที่ generate (อยู่ใน .gitignore) → ต้องสร้างก่อน lint
      # ไม่งั้น type-aware lint ล้มที่หน้า [id] (ในเครื่องไม่เจอเพราะ pnpm dev สร้างไฟล์ไว้แล้ว)
      - run: pnpm --filter @ai-crm/web exec next typegen
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
